<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <link rel="icon" href="/favicon.ico">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PetClinix</title>
  <style>
    #app-splash {
      position: fixed;
      inset: 0;
      z-index: 10000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #ffffff;
      transition: opacity 0.3s ease;
    }

    #app-splash.app-splash-hidden {
      opacity: 0;
      pointer-events: none;
    }

    .app-splash-spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(0, 188, 212, 0.2);
      border-top-color: #00bcd4;
      border-radius: 50%;
      animation: app-splash-spin 0.8s linear infinite;
    }

    .app-splash-title {
      margin-top: 20px;
      font-size: 22px;
      font-weight: 700;
      color: #00bcd4;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    .app-splash-subtitle {
      margin-top: 6px;
      font-size: 13px;
      color: #8a8f98;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    @keyframes app-splash-spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <div id="app"></div>
  <div id="app-splash">
    <div class="app-splash-spinner"></div>
    <div class="app-splash-title">PetClinix</div>
    <div class="app-splash-subtitle">Carregando...</div>
  </div>
  <script>
    (function () {
      var startedAt = Date.now();
      var timer = setInterval(function () {
        if (!document.getElementById("app-splash")) {
          clearInterval(timer);
          return;
        }
        var elapsed = (Date.now() - startedAt) / 1000;
        if (elapsed >= 15) {
          document.querySelector(".app-splash-subtitle").textContent =
            "O servidor pode ainda estar iniciando — na primeira carga do dia isso pode levar até 1 minuto...";
        } else if (elapsed >= 4) {
          document.querySelector(".app-splash-subtitle").textContent =
            "Conectando ao servidor...";
        }
      }, 1000);
    })();
  </script>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
